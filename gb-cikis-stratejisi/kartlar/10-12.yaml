    - "V-33: sınır sürtünmesi %0,5–2 (yalnız GB ve İTÜ), S2'de × 0,5; AB ihracatçısının menşe maliyeti S2'de %0,5, S3'te %1"
    - "V-34: arketip eşikleri (KS, AME, ithalat penetrasyonu, EDE ≥ 0,3 bp/puan, SS ≥ 60) `[H]`"
    - "V-35: SS boyut puanları ve ağırlıkları `[H]` (veri/f3_ss_boyutlar.csv; 10–12 gözden geçirildi, diğerleri ilk tahmin)"
    - "V-36: CKE tanımı — 1 puan tarife ya da %1 üretim desteği, 5 yıl, kapasite yatırımının ithalatı (sermaye/hasıla 1, ithal payı 0,6) düşülü"
    - "V-37: KN8 → NACE eşlemesinde CPA 2.2 → 2.1 kimlik bağlantısı önceliği (D-1)"
    - "V-38: Grup toplamlarının yüzdelikleri çekilişlerin toplamından hesaplanır (sınıf yüzdeliklerinin toplamı değil); 1/98 askısının etkisi askı çekilişlerinin koşullu ortalamasıyla raporlanır"
    - "V-39: Eylem takvimi T'ye göre; T2028'de T−18 geçmişte kaldığından hazırlık eylemleri 2026'nın son çeyreğinde başlar"
