    - "V-30: Faz 3 senaryoları — toplam genel dengeden, sınıf dağılımı kısmi dengeden (ortak z, N = 2.000)"
    - "V-31: S4'te 1/98'in askıya alınma olasılığı 0,25 (hasmane AB) `[H]`"
