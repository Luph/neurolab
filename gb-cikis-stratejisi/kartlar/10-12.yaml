# 10–12 bölüm belgesinin yapısal alanları. Metin kartlar/10-12_metin/'de; f3g_kartlar.py okur.
# ortak_eylemler: [kimlik, araç, parametre, sorumlu, hukuki araç, bütçe, başlangıç → bitiş, performans koşulu, sunset, KPI].
# defter_ortak: ortak eylemlerin T+5'teki yıllık etkisi (sınıf defteriyle aynı birimler).
# Takvim: T2028'de T−18 (1.7.2026) geçmişte kaldığı için hazırlık eylemleri "Hemen" (2026'nın son çeyreği) başlıyor.
bolumler:
  "10": Gıda ürünleri
  "11": İçecekler
  "12": Tütün ürünleri
belge:
  parca: 1
  sonraki: "Faz 3 parça 2 (13–15: tekstil, giyim, deri)"
  ortak_eylemler:
    - - E-10-01
      - 1/98 sürekliliği ve S2'ye aktarımı
      - "(i) 1/98'in 1/95'ten bağımsız hukuki dayanağını belgeleyen dosya; (ii) S2'de 1/98 tavizlerinin ve İTÜ rejiminin en az bugünkü kapsamda aktarımı; (iii) S4'te askı girişimine karşı Ortaklık Konseyi ve DTÖ istişaresi"
      - "Ticaret Bakanlığı (AB GM), Dışişleri Bakanlığı (AB Başkanlığı), Tarım ve Orman Bakanlığı (TOB)"
      - "Ortaklık Konseyi kararı; S2 anlaşma metni (tarım tavizleri eki)"
      - İdari
      - Hemen → T
      - S2 metninde 1/98 tavizleri en az bugünkü kapsamda
      - Yok (anlaşmayla kalıcı)
      - "1/98 kapsamındaki AB'ye ihracat T+1'de T−12 düzeyinin en az %95'i"
    - - E-10-02
      - "Menşe uyumlu DİR: yerli eşdeğer eşya"
      - "AB'ye yönelik İTÜ ihracatında (Fasıl 17–21) DİR'de yerli buğday ve şekerin eşdeğer eşya olarak kullanımı; ithal eşya vergisiz serbest dolaşıma girer. S2'de PSR: Fasıl 19'da menşesiz tahıla fabrika çıkış fiyatının %15'ine kadar tolerans"
      - "Ticaret Bakanlığı (İhracat GM, Gümrükler GM), TMO, Şeker Kurumu"
      - "DİR Kararı ve Tebliği değişikliği; S2 menşe protokolü"
      - "Gelir etkisi ≈ 0 (DİR'de vergi zaten alınmıyor) `[T]`"
      - T−12 → T+60
      - Belge sahibinin AB'ye ihracatı ≥ kullanılan yerli eşdeğer miktar
      - T+60 (PSR yürürlüğe girince gözden geçirilir)
      - "Bisküvi, ekmek ve şekerlemede AB'ye ihracatın menşe ispatlı payı ≥ %85"
    - - E-10-03
      - EUDR uyum masası
      - "Kakao (10.82), kahve (10.83; hazır kahve 30.12.2027'den), soya ve palm türevleri (10.41, 10.91) ve sığır eti (10.11) için coğrafi konum verisi ve özen beyanı desteği; ithalatçılarla ortak veri havuzu. Sığır derisi 18.9.2026'dan kapsam dışı (Tüzük 2026/2102)"
      - "TOB, Ticaret Bakanlığı, TİM (ilgili ihracatçı birlikleri)"
      - "Bakanlık genelgesi; TİM yönetim kurulu kararı"
      - "≈ 0,05 mlr TL/yıl `[T]`"
      - Hemen → T+24
      - Masayı kullanan firma sayısı
      - T+24
      - EUDR gerekçesiyle AB'de reddedilen sevkiyat sayısı sıfır
    - - E-10-04
      - Ticaret savunması hazırlığı
      - "Su ürünleri (10.20) ve işlenmiş meyve-sebzede (10.39) AB'nin damping ve sübvansiyon soruşturmalarına hazırlık: ASCM uyum dosyası, maliyet ve fiyat verisi, AB ithalatçılarıyla ortak savunma"
      - "Ticaret Bakanlığı (İthalat GM, İhracat GM), TOB, ilgili ihracatçı birlikleri"
      - Bakanlık iç talimatı
      - İdari
      - T−12 → T+36
      - —
      - T+36
      - Soruşturma açılırsa 30 gün içinde tam yanıt
    - - E-10-05
      - "S4 geçiş tamponu (yalnız S4)"
      - "AB'ye İTÜ ihracatçılarına (10.62, 10.72, 10.82, 10.89, 11.07) Nairobi kararına uygun ihracat kredi sigortası (vade ≤ 180 gün; primler maliyeti karşılar) ve ürüne özgü olmayan pazar geliştirme; yıllık tavan"
      - "Türk Eximbank, Ticaret Bakanlığı"
      - "Eximbank programı; İhracat Destekleri Kararı"
      - "0,3 mlr TL/yıl × 3 yıl `[T]`"
      - T → T+36
      - Destek alan firmanın AB dışı ihracatının artması
      - T+36
      - "Kapsamdaki firmaların toplam ihracatı ≥ T−12 düzeyi"
    - - E-10-06
      - "Tarımda hücum gündemi (S2)"
      - "Meyve-sebzede giriş fiyatı sisteminden istisna; domates ve işlenmiş ürün kotalarının genişletilmesi; su ürünlerinde kota yerine sıfır tarife; kanatlı ve süt ürünlerinde SPS listelenmesi"
      - "Ticaret Bakanlığı, TOB"
      - "S2 anlaşma metni (tarım ve SPS bölümleri)"
      - İdari
      - Hemen → T
      - AB'nin Türkiye'den talep edeceği tarım tavizleriyle dengeli bir paket
      - —
      - "Tavizli satırlarda AB'ye ihracat T+5'te +%10"
  defter_ortak:
    E-10-03: {mali_s2: 0.05, mali_s4: 0.05}
    E-10-05: {mali_s2: 0, mali_s4: 0.3}
    E-10-06: {ca_s2: 50, ca_s4: 0}
  veri_bosluklari:
    - "VB-30: sınıf düzeyinde yabancı sermaye payı (TÜİK yabancı kontrollü girişim istatistikleri yalnız bölüm düzeyinde)"
    - "VB-31: Türkiye'ye özgü sınıf düzeyi Ar-Ge yoğunluğu (OECD sınıflaması vekil)"
    - "VB-32: DTÖ bağlı oranları, satır düzeyi (WTO CTS); 10–12'de tarife artışı önerilmediği için bağlayıcı değil, sonraki parçalarda gerekli"
    - "VB-33: TMO yerli buğday fiyatı ile ithal paritesi farkı (menşe maliyeti c_RoO'nun kalibrasyonu)"
    - "VB-34: EUDR kapsamındaki ihracatçıların tedarik zinciri verisi"
    - "VB-35: YSHİ ile BACI sınıf eşlemesindeki tutarsızlık (10.86; 11.03, 11.04, 11.06'da YSHİ verisi yok)"
    - "VB-06 (sürüyor): 1/98 tercih oranları satır düzeyinde; 1/98 askısı varyantı bu yüzden üst sınır"
