    riskler:
      - "AB'nin 1/98'i askıya alması ithalat maliyetini artırır → E-10-01 ve E-10.11-01."
    guven: "Yüksek (veri); ihracatın bileşimi `[H]`. `[D?]`: AB'ye et ürünü ihracatındaki SPS listelenme durumu."
