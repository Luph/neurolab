# 16–18 sınıflarının yapısal alanları. Metin kartlar/16-18_metin/'de; f3g_kartlar.py ve f3f_skor_matris.py okur.
# kisa: tablolardaki kısa ad. arketip/durus/tarife_yolu/ana_araclar/ab_muzakere: matristeki kural tabanlı öneriyi
# uzman muhakemesiyle düzeltir `[H]`; guven: metindeki değerlendirmeye göre güven düzeyi (kural tabanlı veri tamlığını
# düzeltir). capa: çapa yatırımcılar (veri sayfası). girdi_hs4: kritik girdiler.
# eylemler: [araç, parametre, sorumlu, hukuki araç, bütçe, başlangıç → bitiş, performans koşulu, sunset, KPI].
# tetikler: [gösterge, eşik, tetiklenecek önlem].
# defter: sınıf paketinin T+5'teki yıllık etkisi (P50), yola göre — tufe_s2 / tufe_s4 (bp; negatif dezenflasyonist),
# mali_s2 / mali_s4 (mlr TL/yıl, bugüne göre), ca_s2 / ca_s4 (mn $/yıl, senaryoya ek katkı).
# Kural tabanlı sınıflama EUDR payı yüksek sınıfları "Yeşil Mutabakat'a maruz" (G) olarak işaretliyor; EUDR bütün
# menşelere ve bütün senaryolarda uygulandığı için G, AB'ye ihracatı küçük sınıflarda birincil arketip olmaktan çıkarıldı.
